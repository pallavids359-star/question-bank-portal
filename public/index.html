<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Question Bank Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#111111;
    --field:#141414;
    --border:#262626;
    --border-focus:#c9a227;
    --text:#e8e8e8;
    --muted:#8a8a8a;
    --label:#9a9a9a;
    --gold:#c9a227;
    --gold-text:#0a0a0a;
    --danger:#e05252;
    --ok:#4caf7d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:28px;
  }
  .wrap{max-width:820px;margin:0 auto;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:26px 28px;
    margin-bottom:20px;
  }
  .header-row{display:flex;justify-content:space-between;align-items:flex-start;}
  h1{font-size:22px;margin:0 0 4px 0;font-weight:700;}
  .sub{color:var(--muted);font-size:11px;letter-spacing:.08em;font-weight:600;text-transform:uppercase;margin:0;}
  hr{border:none;border-top:1px solid var(--border);margin:18px 0 22px 0;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;}
  label.field-label{
    display:block;
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--label);
    font-weight:700;
    margin-bottom:8px;
  }
  label.field-label .req{color:var(--gold);}
  select, input[type=text], textarea{
    width:100%;
    background:var(--field);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:9px;
    padding:11px 14px;
    font-size:14.5px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--border-focus);}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%238a8a8a' stroke-width='1.6' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:34px;}
  textarea{resize:vertical;min-height:70px;}
  .field{margin-bottom:20px;}
  .toggles{display:flex;gap:10px;background:var(--field);border:1px solid var(--border);border-radius:9px;padding:8px;}
  .toggle-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--muted);
    font-weight:700;
    font-size:13px;
    padding:9px 0;
    border-radius:7px;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .toggle-btn.active{background:var(--gold);color:var(--gold-text);}
  .toggle-btn:hover:not(.active){color:var(--text);}
  .mcq-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .mcq-tag{
    width:28px;height:28px;flex-shrink:0;border-radius:7px;background:var(--field);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--muted);
  }
  .mcq-input-col{flex:1;min-width:200px;}
  .actions-row{display:flex;justify-content:flex-end;gap:12px;margin-top:22px;}
  .btn{border:none;border-radius:9px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  .btn-primary{background:var(--gold);color:var(--gold-text);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .btn-ghost:hover{color:var(--text);border-color:#3a3a3a;}
  .list-item{
    background:var(--field);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;margin-bottom:12px;
  }
  .li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .li-meta{font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:6px;}
  .li-meta span{color:var(--gold);}
  .li-q{font-size:14px;line-height:1.5;}
  .li-opts{margin-top:8px;font-size:13px;color:#c9c9c9;line-height:1.8;}
  .li-opts .correct{color:var(--ok);font-weight:700;}
  .li-btns{display:flex;gap:8px;flex-shrink:0;}
  .icon-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:7px;width:32px;height:32px;cursor:pointer;font-size:14px;
  }
  .icon-btn:hover{color:var(--text);}
  .icon-btn.del:hover{color:var(--danger);border-color:var(--danger);}
  .tag-pill{
    display:inline-block;background:#1c1c1c;border:1px solid var(--border);
    color:var(--muted);font-size:10.5px;padding:2px 8px;border-radius:20px;margin-right:6px;
  }
  .empty-state{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ok);color:#04220f;font-weight:700;padding:12px 22px;border-radius:10px;
    font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .filters select{width:auto;min-width:140px;padding:8px 30px 8px 12px;font-size:13px;}
  .count-line{color:var(--muted);font-size:12.5px;margin-bottom:14px;}
  .li-preview{font-size:14px;line-height:1.5;}
  .li-preview .eq-img-remove{display:none;}
  .li-preview .eq-chip{cursor:default;}
  .li-preview img{max-width:160px;max-height:120px;}
  .li-combo{font-size:13px;color:#c9c9c9;margin-top:4px;}
  .li-combo .correct{color:var(--ok);font-weight:700;}
  .latex-preview{
    background:#0d0d0d;border:1px dashed var(--border);border-radius:8px;
    padding:9px 12px;margin-top:6px;font-size:14.5px;min-height:18px;color:#d8d8d8;
    overflow-x:auto;
  }
  .latex-preview:empty{display:none;}
  .latex-preview .katex-error{color:var(--danger);font-family:monospace;font-size:12px;}
  .li-q .katex, .li-opts .katex{font-size:1em;}
  .eq-field{
    width:100%;min-height:44px;background:var(--field);border:1px solid var(--border);
    border-radius:9px;padding:11px 14px;font-size:14.5px;outline:none;
    white-space:pre-wrap;word-break:break-word;line-height:1.6;
  }
  .eq-field.multiline{min-height:70px;}
  .eq-field:focus{border-color:var(--border-focus);}
  .eq-field:empty:before{content:attr(data-placeholder);color:#5c5c5c;}
  .eq-chip{display:inline-block;padding:1px 4px;border-radius:4px;cursor:pointer;}
  .eq-chip:hover{outline:1px dashed var(--gold);}
  .eq-chip .katex-error{color:var(--danger);font-family:monospace;font-size:12px;}
  .eq-hint{font-size:11px;color:#666;margin-top:5px;}
  .predef{
    background:var(--field);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 16px;
    margin-top:4px;
    margin-bottom:20px;
    font-size:13px;
    color:#c9c9c9;
    line-height:1.7;
  }
  .predef .ptitle{color:var(--gold);font-weight:700;margin-bottom:4px;}
  .predef b{color:var(--gold);}
  .eq-wrap{position:relative;}
  .eq-wrap .eq-field{padding-right:38px;}
  .img-link-btn{
    position:absolute; top:6px; right:6px; z-index:2;
    background:var(--field); border:1px solid var(--border); color:var(--gold);
    border-radius:6px; width:26px; height:24px; font-size:13px; cursor:pointer; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .img-link-btn:hover{border-color:var(--border-focus);}
  .eq-field img{max-width:100%;max-height:220px;border-radius:6px;display:inline-block;vertical-align:middle;margin:2px 0;}
  .tbtn{
    background:var(--field);border:1px solid var(--border);color:var(--gold);
    border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .tbtn:hover{border-color:var(--border-focus);}
  .match-row-input{margin-bottom:10px;}
  .combo-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .combo-tag{
    width:28px;height:28px;flex-shrink:0;border-radius:50%;background:var(--field);
    border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--muted);
  }
  .combo-row .eq-field{flex:1;}
  .label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .label-row .field-label{margin-bottom:0;}
  .attach-btn{
    background:var(--field);border:1px solid var(--border);color:var(--gold);
    border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  }
  .attach-btn:hover{border-color:var(--border-focus);}
  .row-item{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .row-item .eq-field{flex:1;margin-bottom:0;}
  .row-remove-btn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:6px;width:26px;height:26px;flex-shrink:0;cursor:pointer;font-size:12px;
    display:flex;align-items:center;justify-content:center;padding:0;
  }
  .row-remove-btn:hover{color:var(--danger);border-color:var(--danger);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:4px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="header-row">
      <div>
        <h1 id="formTitle">Add New Question</h1>
        <p class="sub">Question Entry Form &nbsp;•&nbsp; Press Ctrl+Enter to Save</p>
      </div>
    </div>
    <hr>

    <div class="grid2">
      <div class="field">
        <label class="field-label">Subject <span class="req">*</span></label>
        <select id="subject"><option value="">Select Subject</option></select>
      </div>
      <div class="field">
        <label class="field-label">Class <span class="req">*</span></label>
        <select id="klass"><option value="">Select Class</option></select>
      </div>
      <div class="field">
        <label class="field-label">Chapter <span class="req">*</span></label>
        <select id="chapter"><option value="">Select Chapter</option></select>
      </div>
      <div class="field">
        <label class="field-label">Topic <span class="req">*</span></label>
        <input type="text" id="topic" placeholder="Enter topic">
      </div>
      <div class="field">
        <label class="field-label">Exam Category <span class="req">*</span></label>
        <div class="toggles" id="examToggles"></div>
      </div>
      <div class="field">
        <label class="field-label">Question Type <span class="req">*</span></label>
        <select id="qType">
          <option value="">Select Type</option>
          <option value="mcq_single">MCQ (Single Correct)</option>
          <option value="assertion_reason">Assertion &amp; Reason</option>
          <option value="match">Match the Following</option>
          <option value="numerical">Numerical / Integer Type</option>
          <option value="true_false">True / False</option>
        </select>
      </div>
    </div>

    <div id="mcqBlock">
      <div class="field">
        <div class="label-row">
          <label class="field-label">Question <span class="req">*</span></label>
          <button type="button" class="attach-btn img-link-btn-flat" data-target="question">📎 Attach Image</button>
        </div>
        <div class="eq-field multiline" id="question" data-placeholder="Type the question..." contenteditable="true" spellcheck="false"></div>
      </div>

      <label class="field-label">Options <span class="req">*</span></label>
      <div class="grid2">
        <div class="mcq-row" style="margin:0;">
          <div class="mcq-tag">A</div>
          <div class="mcq-input-col">
            <div class="eq-wrap">
              <div class="eq-field" id="optA" data-placeholder="Option A" contenteditable="true" spellcheck="false"></div>
              <button type="button" class="img-link-btn" data-target="optA" title="Attach Image">📎</button>
            </div>
          </div>
        </div>
        <div class="mcq-row" style="margin:0;">
          <div class="mcq-tag">B</div>
          <div class="mcq-input-col">
            <div class="eq-wrap">
              <div class="eq-field" id="optB" data-placeholder="Option B" contenteditable="true" spellcheck="false"></div>
              <button type="button" class="img-link-btn" data-target="optB" title="Attach Image">📎</button>
            </div>
          </div>
        </div>
        <div class="mcq-row" style="margin:0;">
          <div class="mcq-tag">C</div>
          <div class="mcq-input-col">
            <div class="eq-wrap">
              <div class="eq-field" id="optC" data-placeholder="Option C" contenteditable="true" spellcheck="false"></div>
              <button type="button" class="img-link-btn" data-target="optC" title="Attach Image">📎</button>
            </div>
          </div>
        </div>
        <div class="mcq-row" style="margin:0;">
          <div class="mcq-tag">D</div>
          <div class="mcq-input-col">
            <div class="eq-wrap">
              <div class="eq-field" id="optD" data-placeholder="Option D" contenteditable="true" spellcheck="false"></div>
              <button type="button" class="img-link-btn" data-target="optD" title="Attach Image">📎</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="arBlock" style="display:none;">
      <div class="field">
        <div class="label-row">
          <label class="field-label">Assertion (A) <span class="req">*</span></label>
          <button type="button" class="attach-btn img-link-btn-flat" data-target="assertion">📎 Attach Image</button>
        </div>
        <div class="eq-field multiline" id="assertion" data-placeholder="Type Assertion (A)..." contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="field">
        <div class="label-row">
          <label class="field-label">Reason (R) <span class="req">*</span></label>
          <button type="button" class="attach-btn img-link-btn-flat" data-target="reason">📎 Attach Image</button>
        </div>
        <div class="eq-field multiline" id="reason" data-placeholder="Type Reason (R)..." contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="field">
        <label class="field-label">Predefined Options</label>
        <div class="eq-field multiline" id="predefOptions" contenteditable="true" spellcheck="false" data-placeholder="Predefined options text (editable)"></div>
      </div>
    </div>

    <div id="matchBlock" style="display:none;">
      <div class="grid2">
        <div class="field">
          <label class="field-label">Column A <span class="req">*</span></label>
          <div id="columnARows"></div>
          <button type="button" class="tbtn wide" id="addColumnARow">+ Add Row</button>
        </div>
        <div class="field">
          <label class="field-label">Column B <span class="req">*</span></label>
          <div id="columnBRows"></div>
          <button type="button" class="tbtn wide" id="addColumnBRow">+ Add Row</button>
        </div>
      </div>
      <div class="field" style="margin-top:6px;">
        <label class="field-label">Option Combinations <span class="req">*</span></label>
        <div id="matchOptionsRows"></div>
      </div>
    </div>

    <div id="numBlock" style="display:none;">
      <div class="field">
        <div class="label-row">
          <label class="field-label">Numerical Question <span class="req">*</span></label>
          <button type="button" class="attach-btn img-link-btn-flat" data-target="numQuestion">📎 Attach Image</button>
        </div>
        <div class="eq-field multiline" id="numQuestion" data-placeholder="Type the question..." contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="field">
        <label class="field-label">Correct Numerical Value <span class="req">*</span></label>
        <div class="eq-field" id="numAnswer" data-placeholder="e.g. 9.8 or -5" contenteditable="true" spellcheck="false"></div>
      </div>
    </div>

    <div class="field" style="margin-top:20px;" id="correctOptionWrap">
      <label class="field-label">Correct Option <span class="req">*</span></label>
      <select id="correctOption">
        <option value="">Select Correct Option</option>
        <option value="A">Option A</option>
        <option value="B">Option B</option>
        <option value="C">Option C</option>
        <option value="D">Option D</option>
      </select>
    </div>

    <div class="field">
      <div class="label-row">
        <label class="field-label">Solution / Explanation</label>
        <button type="button" class="attach-btn img-link-btn-flat" data-target="solutionText">📎 Attach Image</button>
      </div>
      <div class="eq-field multiline" id="solutionText" data-placeholder="Type the solution..." contenteditable="true" spellcheck="false"></div>
    </div>

    <div class="actions-row">
      <button class="btn btn-ghost" id="resetBtn">Clear Form</button>
      <button class="btn btn-primary" id="saveBtn">Save Question</button>
    </div>
  </div>

  <div class="card">
    <div class="header-row" style="margin-bottom:14px;">
      <h1 style="font-size:18px;">Saved Questions</h1>
    </div>
    <div class="filters">
      <select id="fSubject"><option value="">All Subjects</option></select>
      <select id="fType">
        <option value="">All Types</option>
        <option value="mcq_single">MCQ (Single Correct)</option>
        <option value="assertion_reason">Assertion &amp; Reason</option>
        <option value="match">Match the Following</option>
        <option value="numerical">Numerical / Integer Type</option>
        <option value="true_false">True / False</option>
      </select>
    </div>
    <div class="count-line" id="countLine"></div>
    <div id="listContainer"></div>
  </div>

</div>
<div class="toast" id="toast"></div>
<input type="file" id="hiddenImageInput" accept="image/*" style="display:none;">

<script>
(function(){

const SUBJECTS = ["Physics","Chemistry","Biology","Maths"];
const CLASSES = ["11","12"];
// standard NCERT chapter names, keyed by "Subject-Class"
const NCERT_CHAPTERS = {
  "Physics-11": [
    "Physical World","Units and Measurements","Motion in a Straight Line","Motion in a Plane",
    "Laws of Motion","Work, Energy and Power","System of Particles and Rotational Motion","Gravitation",
    "Mechanical Properties of Solids","Mechanical Properties of Fluids","Thermal Properties of Matter",
    "Thermodynamics","Kinetic Theory","Oscillations","Waves"
  ],
  "Physics-12": [
    "Electric Charges and Fields","Electrostatic Potential and Capacitance","Current Electricity",
    "Moving Charges and Magnetism","Magnetism and Matter","Electromagnetic Induction","Alternating Current",
    "Electromagnetic Waves","Ray Optics and Optical Instruments","Wave Optics",
    "Dual Nature of Radiation and Matter","Atoms","Nuclei","Semiconductor Electronics: Materials, Devices and Simple Circuits"
  ],
  "Chemistry-11": [
    "Some Basic Concepts of Chemistry","Structure of Atom","Classification of Elements and Periodicity in Properties",
    "Chemical Bonding and Molecular Structure","Thermodynamics","Equilibrium","Redox Reactions",
    "Organic Chemistry: Some Basic Principles and Techniques","Hydrocarbons"
  ],
  "Chemistry-12": [
    "Solutions","Electrochemistry","Chemical Kinetics","d- and f-Block Elements","Coordination Compounds",
    "Haloalkanes and Haloarenes","Alcohols, Phenols and Ethers","Aldehydes, Ketones and Carboxylic Acids",
    "Amines","Biomolecules"
  ],
  "Biology-11": [
    "The Living World","Biological Classification","Plant Kingdom","Animal Kingdom",
    "Morphology of Flowering Plants","Anatomy of Flowering Plants","Structural Organisation in Animals",
    "Cell: The Unit of Life","Biomolecules","Cell Cycle and Cell Division","Transport in Plants",
    "Mineral Nutrition","Photosynthesis in Higher Plants","Respiration in Plants",
    "Plant Growth and Development","Digestion and Absorption","Breathing and Exchange of Gases",
    "Body Fluids and Circulation","Excretory Products and their Elimination","Locomotion and Movement",
    "Neural Control and Coordination","Chemical Coordination and Integration"
  ],
  "Biology-12": [
    "Sexual Reproduction in Flowering Plants","Human Reproduction","Reproductive Health",
    "Principles of Inheritance and Variation","Molecular Basis of Inheritance","Evolution",
    "Human Health and Disease","Microbes in Human Welfare","Biotechnology: Principles and Processes",
    "Biotechnology and its Applications","Organisms and Populations","Ecosystem",
    "Biodiversity and Conservation"
  ],
  "Maths-11": [
    "Sets","Relations and Functions","Trigonometric Functions","Principle of Mathematical Induction",
    "Complex Numbers and Quadratic Equations","Linear Inequalities","Permutations and Combinations",
    "Binomial Theorem","Sequences and Series","Straight Lines","Conic Sections",
    "Introduction to Three Dimensional Geometry","Limits and Derivatives","Statistics","Probability"
  ],
  "Maths-12": [
    "Relations and Functions","Inverse Trigonometric Functions","Matrices","Determinants",
    "Continuity and Differentiability","Application of Derivatives","Integrals","Application of Integrals",
    "Differential Equations","Vector Algebra","Three Dimensional Geometry","Linear Programming","Probability"
  ]
};
const EXAMS = ["NEET","JEE","KCET"];
const QTYPE_LABELS = {
  mcq_single:"MCQ (Single Correct)",
  assertion_reason:"Assertion & Reason", match:"Match the Following",
  numerical:"Numerical / Integer Type", true_false:"True / False"
};

let selectedExams = new Set();
let editingId = null;
let allQuestions = [];

// ---------- LaTeX rendering ----------
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Converts stray literal Unicode math symbols (e.g. a pasted "√2") into
// proper LaTeX commands before KaTeX sees them. Without this, KaTeX's
// strict mode throws "Unrecognized Unicode character" warnings/errors
// for symbols like √ that it doesn't accept as raw input.
function normalizeLatexExpr(expr){
  if(!expr) return expr;
  // √(...) or √x or √2.5 -> \sqrt{...}
  expr = expr.replace(/√\s*\(([^()]+)\)/g, '\\sqrt{$1}');
  expr = expr.replace(/√\s*([0-9]+(?:\.[0-9]+)?|[a-zA-Z]+)/g, '\\sqrt{$1}');
  expr = expr.replace(/√/g, '\\surd '); // any leftover bare √ with no clear argument
  // other common literal Unicode symbols KaTeX doesn't accept raw
  expr = expr

      const delim = isDisplay ? '$$' : '$';

      const end = raw.indexOf(delim, start);

  sigma:'\\sigma', phi:'\\phi', delta:'\\delta', epsilon:'\\epsilon'

// English words that merely CONTAIN a greek word as a substring alone

      if(buf){ segments.push({type:'final', value:buf}); buf=''; }

  if(/[A-Za-z0-9]_\{?[A-Za-z0-9+\-]+\}?/.test(work)) changed = true;
  if(/[A-Za-z0-9)\]]\^\{?[A-Za-z0-9+\-]+\}?/.test(work)) changed = true;

  // superscript, bare or already braced (e.g. "x^2" or "x^{2}") — normalize
  // to braced form and flag as needing math wrapping. Matches either a full
  // "{...}" group (already correct, left as-is) or a bare unbraced run —
  // never partially, which would wrongly eat an unrelated closing brace
  // from an enclosing structure like \frac{...}'s own argument brace.
  const supFixed = work.replace(/([A-Za-z0-9)\]])\^(\{[^{}]*\}|-?[A-Za-z0-9]+)/g, (m, base, exp) => {
    if(exp.startsWith('{')) return m;
    return base + '^{' + exp + '}';
  });
  if(supFixed !== work){ work = supFixed; changed = true; }

  // operators
  [[/<=/g,'\\le{}'],[/>=/g,'\\ge{}'],[/!=/g,'\\ne{}']].forEach(([re,rep])=>{
    if(re.test(work)){ work = work.replace(re, rep); changed = true; }
  });

  return {latex: work, changed};
}

// things that must NEVER be converted even though they contain "/":
// URLs, file paths, dates, common unit-rate fractions, markdown links, inline code
const UNIT_FRACTIONS = new Set([
  'km/h','km/hr','m/s','kg/s','cm/s','ft/s','mi/h','mph','rad/s','g/l','mg/ml','g/ml'
]);
function isNonMathToken(str){
  if(/^https?:\/\//i.test(str)) return true;                 // URL
  if(/^www\./i.test(str)) return true;                        // URL without scheme
  if(/^[A-Za-z]:\\/.test(str)) return true;                   // Windows path
  if(/^\.{1,2}\//.test(str)) return true;                     // relative file path
  if(/^\d{1,4}\/\d{1,2}(\/\d{1,4})?$/.test(str)) return true; // date, e.g. 12/08/2026
  if(/^\[.*\]\(.*\)$/.test(str)) return true;                 // markdown link
  if(/^`.*`$/.test(str)) return true;                         // inline code
  if(UNIT_FRACTIONS.has(str.toLowerCase())) return true;      // km/h, m/s, kg/s, ...
  return false;
}

function convertToken(tokRaw){
  const m0 = tokRaw.match(/^(.*?)([.,;:!?]*)$/s);
  const core = m0[1], trailing = m0[2];
  if(!core) return {converted:false};

  // already valid LaTeX (e.g. \frac{a}{b} typed without $) -> render as-is
  if(/\\[a-zA-Z]/.test(core)) return {converted:true, latex:core, trailing};

  const lower = core.toLowerCase();
  if(lower === 'infinity') return {converted:true, latex:'\\infty', trailing};
  if(core === '+-') return {converted:true, latex:'\\pm{}', trailing};

  if(isNonMathToken(core)) return {converted:false};

  // parenthesized expressions: try a single top-level fraction match FIRST.
  // This correctly resolves nested cases like "(a/b)/(c/d)" into one
  // \frac{\frac{a}{b}}{\frac{c}{d}} instead of falling into the general
  // multi-group expander (which is only for implicit-multiplication cases
  // like "(a)(b)" that have no single top-level "/").
  if(core.includes('(') || core.includes(')') || core.includes('[') || core.includes(']')){
    const f = convertFraction(core);
    if(f !== core) return {converted:true, latex:f, trailing};
    const g = convertGeneralExpression(core);
    if(g.changed) return {converted:true, latex:g.latex, trailing};
  }

  let work = core, changed = false;

  // sqrt(...) / root(n,...)
  let m;
  if(!changed && (m = work.match(/^sqrt\((.+)\)$/i))){
    work = '\\sqrt{' + convertFraction(m[1]) + '}'; changed = true;
  } else if(!changed && (m = work.match(/^root\((\d+),(.+)\)$/i))){
    work = '\\sqrt[' + m[1] + ']{' + convertFraction(m[2]) + '}'; changed = true;
  }

  // chemical charges: Na+, Ca2+, SO4^2-
  if(!changed && (m = work.match(/^([A-Za-z0-9]+?)(\^?)(\d*)([+-])$/))){
    const base = convertChemSubscripts(m[1]);
    const supPart = (m[3] ? m[3] : '') + m[4];
    work = base + '^{' + supPart + '}'; changed = true;
  }

  // trig / log / ln, optionally with an attached ^power
  if(!changed){
    for(const key in TRIG_WORDS){
      const re = new RegExp('^' + key + '(\\^\\{?\\d+\\}?)?$', 'i');
      if(re.test(work)){
        work = work.replace(new RegExp('^'+key,'i'), TRIG_WORDS[key]);
        work = work.replace(/\^\{?(\d+)\}?$/, '^{$1}');
        changed = true; break;
      }
    }
  }

  // fraction chains (a/b, a/b+c/d, 1/R1-1/R2+x/y), generic identifier
  // subscripts (R1 -> R_{1}, H2O -> H_{2}O), Greek words, <= >= != operators
  if(!changed){
    const sc = convertSimpleChunk(work);
    if(sc.changed){ work = sc.latex; changed = true; }
  }

  // superscript: x^2, x^{2}, x^10 (only if nothing above already handled it)
  if(!changed && work.includes('^')){
    const s = work.replace(/\^\{?(-?\d+)\}?/g, '^{$1}');
    if(s !== work){ work = s; changed = true; }
  }

  if(changed) return {converted:true, latex:work, trailing};
  return {converted:false};
}

function smartConvertZone(text){
  // Strip/convert common LaTeX DOCUMENT-structuring commands (from pasted
  // exam sources) that KaTeX — a math-only renderer — can never understand,
  // no matter how "complete" they look. These must never reach KaTeX.
  text = text
    .replace(/\\item\s*\[([^\]]*)\]\s*/g, '$1 ')   // \item[3.] -> "3. "
    .replace(/\\item\b\s*/g, '\u2022 ')             // bare \item -> bullet
    .replace(/\\(?:begin|end)\{(?:itemize|enumerate)\*?\}\s*/g, '') // list wrappers, just strip
    .replace(/\\(?:textbf|textit|emph|text)\{([^{}]*)\}/g, '$1')    // keep inner text, drop styling
    .replace(/\\section\*?\{([^{}]*)\}/g, '$1\n');

  // normalize the Unicode "minus sign" (U+2212) — commonly produced by
  // autocorrect/paste — to a plain ASCII hyphen so the fraction/term
  // splitter recognizes it as an operator. Safe: U+2212 is unambiguously
  // a math symbol and never appears in ordinary prose.
  text = text.replace(/\u2212/g, '-');

  // normalize Unicode superscript/subscript digit characters (², ₁, etc. —
  // common when pasting from formatted sources) into plain ASCII ^{...}
  // and _{...} notation, so the existing superscript/subscript detection
  // logic below can recognize and properly render them
  text = text.replace(/([\u2070\u00b9\u00b2\u00b3\u2074-\u2079\u207a\u207b]+)/g, m =>
    '^{' + m.split('').map(c => UNICODE_SUPERSCRIPTS[c] || c).join('') + '}');
  text = text.replace(/([\u2080-\u2089\u208a\u208b]+)/g, m =>
    '_{' + m.split('').map(c => UNICODE_SUBSCRIPTS[c] || c).join('') + '}');

  // LaTeX environments (matrices, cases, aligned equations, etc.) must
  // render as ONE atomic block. Wrap the whole \begin{...}...\end{...}
  // span in $...$ now, before any whitespace-based tokenization below
  // gets a chance to fragment it row-by-row.
  text = text.replace(/\\begin\{([a-zA-Z*]+)\}[\s\S]*?\\end\{\1\}/g, m => wrapMath(m));

  // phrase-level calculus patterns first (span multiple words)
  text = text.replace(/\bint\s+(\S.*?)\s+dx\b/g, (m, expr) => wrapMath('\\int ' + expr.trim() + '\\,dx'));
  text = text.replace(/\bsum\s+i\s*=\s*(\S+)\s+to\s+(\S+)/gi, (m, a, b) => wrapMath('\\sum_{i=' + a + '}^{' + b + '}'));
  text = text.replace(/\blim\s+([a-zA-Z])\s*->\s*(\S+)/gi, (m, v, to) => wrapMath('\\lim_{' + v + '\\to ' + to + '}'));

  // don't re-process the $...$ chunks the phrase pass just created
  const parts = text.split(/(\$[^$]*\$)/g);
  return parts.map(part=>{
    if(part.startsWith('$') && part.endsWith('$') && part.length > 1) return part;
    // paren-aware tokenization: keeps "(a/b)(c − d)" together as one unit
    return groupBalancedTokens(part).map(t=>{
      if(t.type === 'space') return t.value;
      const r = convertToken(t.value);
      return r.converted ? wrapMath(r.latex) + r.trailing : t.value;
    }).join('');
  }).join('');
}

// applies smartConvertZone only to the plain-text portions of raw,
// leaving existing $...$ math and {{IMG::}} image markers untouched
function smartConvertRaw(raw){
  return splitFinalSegments(raw).map(seg=>{
    // re-split: 'final' segments from splitFinalSegments already include both
    // math/img AND the plain runs between them (see buf handling above) — so
    // detect which is which by re-testing the segment shape
    if(seg.value.startsWith('$') || seg.value.startsWith('{{IMG::')) return seg.value;
    return smartConvertZone(seg.value);
  }).join('');
}

function convertField(el, refocus){
  if(refocus === undefined) refocus = true;
  // Text explicitly wrapped in $...$ always renders as LaTeX.
  // Plain text is scanned by the smart parser: recognizable math
  // patterns (fractions, exponents, chemical formulas, charges,
  // roots, Greek letters, operators, trig/calculus) auto-convert;
  // everything else is left exactly as typed.
  let raw = getFieldRaw(el);
  raw = smartConvertRaw(raw);
  const frag = buildEquationFragment(raw);
  el.innerHTML = '';
  el.appendChild(frag);
  if(refocus) placeCursorAtEnd(el); // only needed when triggered by Enter (keep typing); NEVER on blur — calling .focus() there would trap focus and break Tab navigation
}
function attachEquationField(idOrEl){
  const el = typeof idOrEl === 'string' ? document.getElementById(idOrEl) : idOrEl;
  const multiline = el.classList.contains('multiline');
  el.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      if(e.shiftKey && multiline){
        e.preventDefault();
        document.execCommand('insertLineBreak');
        return;
      }
      if(multiline && looksIncompleteLatex(getFieldRaw(el))){
        // the LaTeX typed so far is structurally unfinished (open brace,
        // dangling command, or a \frac/\binom missing its 2nd argument) —
        // treat Enter as a plain newline instead of rendering a broken
        // fragment, so the whole expression stays together until complete
        e.preventDefault();
        document.execCommand('insertLineBreak');
        return;
      }
      e.preventDefault();
      convertField(el);
    }
  });
  // also render on blur (losing focus) — short fields like Options are
  // often filled in and then tabbed/clicked away from without ever
  // pressing Enter, so without this the LaTeX in them never renders.
  // Pass refocus=false — re-focusing here would trap the user in this
  // field and break Tab/click navigation to the next field.
  el.addEventListener('blur', ()=>{
    if(!multiline && looksIncompleteLatex(getFieldRaw(el))) return; // still mid-argument, don't cut it off
    convertField(el, false);
  });
  el.addEventListener('paste', (e)=>{
    const items = e.clipboardData && e.clipboardData.items;
    if(items){
      for(const item of items){
        if(item.type && item.type.indexOf('image') === 0){
          e.preventDefault();
          const file = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (ev)=>{ insertImageChipAtCursor(el, ev.target.result); };
          reader.readAsDataURL(file);
          return;
        }
      }
    }
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });
}

// ---------- Supabase backend API ----------
// For local development, keep the backend running with `npm start`.
// When deploying, define window.QUESTION_BANK_API_URL before this script.
const API_BASE_URL =
  window.QUESTION_BANK_API_URL || '/api/questions';

async function apiRequest(path = '', options = {}){
  const response = await fetch(API_BASE_URL + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });

  const contentType = response.headers.get('content-type') || '';
  const body = contentType.includes('application/json')
    ? await response.json()
    : await response.text();

  if(!response.ok){
    const details =
      body && typeof body === 'object'
        ? (body.details || body.error)
        : body;
    throw new Error(details || `Request failed with status ${response.status}`);
  }

  return body;
}

async function loadQuestions(){
  try{
    allQuestions = await apiRequest();
  }catch(e){
    allQuestions = [];
    console.error('Could not load questions:', e);
    showToast(
      'Could not connect to the backend. Make sure npm start is running.',
      true
    );
  }
  renderFilterSubjects();
  renderList();
}

function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function eqVal(id){ return getFieldRaw(document.getElementById(id)).trim(); }

function validate(){
  if(!subjectSel.value) return 'Please select a Subject.';
  if(!klassSel.value) return 'Please select a Class.';
  if(!val('chapter')) return 'Please select a Chapter.';
  if(!val('topic')) return 'Please enter a Topic.';
  if(selectedExams.size === 0) return 'Please select an Exam Category.';
  const qType = document.getElementById('qType').value;
  if(!qType) return 'Please select a Question Type.';
  if(qType === 'assertion_reason'){
    if(!eqVal('assertion')) return 'Please enter the Assertion (A).';
    if(!eqVal('reason')) return 'Please enter the Reason (R).';
  } else if(qType === 'match'){
    const rowsA = getRowValues('columnARows');
    const rowsB = getRowValues('columnBRows');
    if(!rowsA[0] || !rowsA[1]) return 'Please fill both required rows in Column A.';
    if(!rowsB[0] || !rowsB[1]) return 'Please fill both required rows in Column B.';
    if(!eqVal('matchOptA') || !eqVal('matchOptB') || !eqVal('matchOptC') || !eqVal('matchOptD')) return 'All four option combinations are required.';
  } else if(qType === 'numerical'){
    if(!eqVal('numQuestion')) return 'Please enter the Numerical Question.';
    if(!eqVal('numAnswer')) return 'Please enter the Correct Numerical Value.';
  } else {
    if(!eqVal('question')) return 'Please enter the Question.';
    if(!eqVal('optA') || !eqVal('optB') || !eqVal('optC') || !eqVal('optD')) return 'All four options are required.';
  }
  if(qType !== 'numerical' && !document.getElementById('correctOption').value) return 'Please select the Correct Option.';
  return null;
}

    const saved = wasEditing
      ? await apiRequest('/' + encodeURIComponent(editingId), {
          method: 'PUT',
          body: JSON.stringify(record)
        })
      : await apiRequest('', {
          method: 'POST',
          body: JSON.stringify(record)
        });

    if(wasEditing){
      const idx = allQuestions.findIndex(q=>q.id===editingId);
      if(idx > -1) allQuestions[idx] = saved;
    } else {
      allQuestions.unshift(saved);
    }

    renderFilterSubjects();
    renderList();
    showToast(wasEditing ? 'Question updated in Supabase.' : 'Question saved to Supabase.');
    resetForm();
  }catch(e){
    console.error('Save failed:', e);
    showToast('Save failed: ' + e.message, true);
    saveBtn.textContent = editingId ? 'Update Question' : 'Save Question';
  }finally{
    saveBtn.disabled = false;
  }
}

function resetForm(){
  editingId = null;
  document.getElementById('formTitle').textContent = 'Add New Question';
  document.getElementById('saveBtn').textContent = 'Save Question';
  subjectSel.value=''; klassSel.value='';
  updateChapterOptions();
  document.getElementById('topic').value='';
  selectedExams.clear();
  examTogglesEl.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('qType').value='';
  ['question','optA','optB','optC','optD','solutionText','assertion','reason','numQuestion','numAnswer'].forEach(id=>{
    document.getElementById(id).innerHTML='';
  });
  fillDefaultPredef();
  resetColumnRows('columnARows', columnALabel, 4);
  resetColumnRows('columnBRows', columnBLabel, 4);
  resetCombos(4);
  document.getElementById('correctOption').value='';
  updateTypeVisibility();
}

document.getElementById('saveBtn').addEventListener('click', saveQuestion);
document.getElementById('resetBtn').addEventListener('click', resetForm);
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); saveQuestion(); }
});

const listContainer = document.getElementById('listContainer');
const fSubject = document.getElementById('fSubject');
const fType = document.getElementById('fType');
fSubject.addEventListener('change', renderList);
fType.addEventListener('change', renderList);

function renderFilterSubjects(){
  const subs = Array.from(new Set(allQuestions.map(q=>q.subject))).filter(Boolean);
  const cur = fSubject.value;
  fSubject.innerHTML = '<option value="">All Subjects</option>' + subs.map(s=>`<option value="${s}">${s}</option>`).join('');
  fSubject.value = subs.includes(cur) ? cur : '';
}

function renderStaticPreview(raw){
  const span = document.createElement('span');
  span.className = 'li-preview';
  span.appendChild(buildEquationFragment(raw || ''));
  return span;
}

function renderList(){
  const subjF = fSubject.value, typeF = fType.value;
  const filtered = allQuestions.filter(q=>(!subjF||q.subject===subjF) && (!typeF||q.qType===typeF));
  document.getElementById('countLine').textContent = filtered.length + ' question' + (filtered.length===1?'':'s');

  listContainer.innerHTML = '';
  if(filtered.length===0){
    listContainer.innerHTML = '<div class="empty-state">No questions saved yet. Add one above.</div>';
    return;
  }

  filtered.forEach(q=>{
    const item = document.createElement('div');
    item.className = 'list-item';
    item.dataset.id = q.id;

    const top = document.createElement('div');
    top.className = 'li-top';

    const main = document.createElement('div');
    main.style.flex = '1';

    const meta = document.createElement('div');
    meta.className = 'li-meta';
    meta.innerHTML = `<span>${escapeHtml(q.subject)}</span> · Class ${escapeHtml(q.klass)} · ${escapeHtml(q.chapter||'')} &nbsp;›&nbsp; ${escapeHtml(q.topic)} &nbsp;•&nbsp; ${QTYPE_LABELS[q.qType]||q.qType}`;
    main.appendChild(meta);

    if(q.qType === 'assertion_reason'){
      const aLine = document.createElement('div'); aLine.appendChild(document.createTextNode('A: '));
      aLine.appendChild(renderStaticPreview(q.assertion)); main.appendChild(aLine);
      const rLine = document.createElement('div'); rLine.style.marginTop='4px'; rLine.appendChild(document.createTextNode('R: '));
      rLine.appendChild(renderStaticPreview(q.reason)); main.appendChild(rLine);
      const combo = document.createElement('div');
      combo.className = 'li-combo';
      combo.textContent = 'Correct: Option ' + (q.correctOption||'—');
      main.appendChild(combo);
    } else if(q.qType === 'match'){
      const colWrap = document.createElement('div');
      colWrap.className = 'li-combo';
      colWrap.appendChild(document.createTextNode('Column A: '));
      (q.columnA||[]).forEach((v,i)=>{
        if(i>0) colWrap.appendChild(document.createTextNode(' | '));
        colWrap.appendChild(renderStaticPreview(v));
      });
      colWrap.appendChild(document.createTextNode('   ·   Column B: '));
      (q.columnB||[]).forEach((v,i)=>{
        if(i>0) colWrap.appendChild(document.createTextNode(' | '));
        colWrap.appendChild(renderStaticPreview(v));
      });
      main.appendChild(colWrap);
      const mo = q.matchOptions || {};
      const optsLine = document.createElement('div');
      optsLine.className = 'li-combo';
      ['A','B','C','D'].forEach(l=>{
        const isCorrect = q.correctOption === l;
        const span = document.createElement('span');
        if(isCorrect) span.className = 'correct';
        span.appendChild(document.createTextNode(l + ': '));
        span.appendChild(renderStaticPreview(mo[l]||''));
        if(isCorrect) span.appendChild(document.createTextNode(' ✓'));
        optsLine.appendChild(span);
        optsLine.appendChild(document.createTextNode('  '));
      });
      main.appendChild(optsLine);
    } else if(q.qType === 'numerical'){
      const qLine = document.createElement('div');
      qLine.appendChild(renderStaticPreview(q.question));
      main.appendChild(qLine);
      const ansLine = document.createElement('div');
      ansLine.className = 'li-combo correct';
      ansLine.appendChild(document.createTextNode('Correct Value: '));
      ansLine.appendChild(q.numAnswer ? renderStaticPreview(q.numAnswer) : document.createTextNode('—'));
      main.appendChild(ansLine);
    } else {
      const qLine = document.createElement('div');
      qLine.appendChild(renderStaticPreview(q.question));
      main.appendChild(qLine);
      const optsLine = document.createElement('div');
      optsLine.className = 'li-combo';
      ['A','B','C','D'].forEach(l=>{
        const row = document.createElement('span');
        row.style.display = 'block';
        const isCorrect = q.correctOption === l;
        if(isCorrect) row.className = 'correct';
        row.appendChild(document.createTextNode(l + ': '));
        row.appendChild(renderStaticPreview(q['opt'+l]));
        if(isCorrect) row.appendChild(document.createTextNode(' ✓'));
        optsLine.appendChild(row);
      });
      main.appendChild(optsLine);
    }

    const examsLine = document.createElement('div');
    examsLine.style.marginTop = '8px';
    (q.exams||[]).forEach(ex=>{
      const pill = document.createElement('span');
      pill.className = 'tag-pill';
      pill.textContent = ex;
      examsLine.appendChild(pill);
    });
    main.appendChild(examsLine);

    const btns = document.createElement('div');
    btns.className = 'li-btns';
    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn'; editBtn.title = 'Edit'; editBtn.textContent = '✎';
    editBtn.addEventListener('click', ()=>QP.edit(q.id));
    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn del'; delBtn.title = 'Delete'; delBtn.textContent = '✕';
    delBtn.addEventListener('click', ()=>QP.remove(q.id));
    btns.appendChild(editBtn); btns.appendChild(delBtn);

    top.appendChild(main);
    top.appendChild(btns);
    item.appendChild(top);
    listContainer.appendChild(item);
  });
}

function setFieldFromRaw(id, raw){
  const el = document.getElementById(id);
  el.innerHTML = '';
  el.appendChild(buildEquationFragment(raw || ''));
}
function setEqFieldElFromRaw(el, raw){
  el.innerHTML = '';
  el.appendChild(buildEquationFragment(raw || ''));
}

window.QP = {
  edit: function(id){
    const q = allQuestions.find(x=>x.id===id);
    if(!q) return;
    editingId = id;
    document.getElementById('formTitle').textContent = 'Edit Question';
    document.getElementById('saveBtn').textContent = 'Update Question';

    subjectSel.value = q.subject; klassSel.value = q.klass;
    updateChapterOptions();
    document.getElementById('chapter').value = q.chapter || '';
    document.getElementById('topic').value = q.topic || '';

    selectedExams = new Set(q.exams||[]);
    examTogglesEl.querySelectorAll('.toggle-btn').forEach(b=>{
      b.classList.toggle('active', selectedExams.has(b.textContent));
    });

    qTypeSel.value = q.qType;
    updateTypeVisibility();

    if(q.qType === 'assertion_reason'){
      setFieldFromRaw('assertion', q.assertion);
      setFieldFromRaw('reason', q.reason);
      if(q.predefOptions) setFieldFromRaw('predefOptions', q.predefOptions);
    } else if(q.qType === 'match'){
      const colA = (q.columnA && q.columnA.length) ? q.columnA : ['','','',''];
      const colB = (q.columnB && q.columnB.length) ? q.columnB : ['','','',''];
      resetColumnRows('columnARows', columnALabel, colA.length);
      resetColumnRows('columnBRows', columnBLabel, colB.length);
      Array.from(document.getElementById('columnARows').children).forEach((wrap,i)=>setEqFieldElFromRaw(wrap.querySelector('.eq-field'), colA[i]||''));
      Array.from(document.getElementById('columnBRows').children).forEach((wrap,i)=>setEqFieldElFromRaw(wrap.querySelector('.eq-field'), colB[i]||''));
      const mo = q.matchOptions || {};
      const moKeys = ['A','B','C','D'];
      resetCombos(Math.max(4, moKeys.length));
      setFieldFromRaw('matchOptA', mo.A || '');
      setFieldFromRaw('matchOptB', mo.B || '');
      setFieldFromRaw('matchOptC', mo.C || '');
      setFieldFromRaw('matchOptD', mo.D || '');
    } else if(q.qType === 'numerical'){
      setFieldFromRaw('numQuestion', q.question);
      setFieldFromRaw('numAnswer', q.numAnswer || '');
    } else {
      setFieldFromRaw('question', q.question);
      setFieldFromRaw('optA', q.optA);
      setFieldFromRaw('optB', q.optB);
      setFieldFromRaw('optC', q.optC);
      setFieldFromRaw('optD', q.optD);
    }

    document.getElementById('correctOption').value = q.correctOption || '';
    setFieldFromRaw('solutionText', q.solutionText);

    window.scrollTo({top:0, behavior:'smooth'});
  },
  remove: async function(id){
    if(!confirm('Delete this question? This cannot be undone.')) return;
    try{
      await apiRequest('/' + encodeURIComponent(id), { method: 'DELETE' });
      allQuestions = allQuestions.filter(x=>x.id!==id);
      renderFilterSubjects();
      renderList();
      showToast('Question deleted from Supabase.');
    }catch(e){
      console.error('Delete failed:', e);
      showToast('Delete failed: ' + e.message, true);
    }
  }
};

loadQuestions();

})();
</script>
